<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Paleo Virtual FCEyN">
  <defs>
    <style>
      :root {
        --bg: #f4fbff;
        --panel: #ffffff;
        --fg: #102236;
        --cyan: #007f96;
        --aqua: #008f77;
        --grid: rgba(0, 126, 150, 0.18);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #050b12;
          --panel: #0b1726;
          --fg: #f3ffff;
          --cyan: #59f3ff;
          --aqua: #00ffc6;
          --grid: rgba(89, 243, 255, 0.22);
        }
      }
    </style>
    <linearGradient id="surface" x1="8" x2="56" y1="6" y2="58">
      <stop offset="0" stop-color="var(--panel)"/>
      <stop offset="1" stop-color="var(--bg)"/>
    </linearGradient>
    <linearGradient id="accent" x1="17" x2="48" y1="14" y2="50">
      <stop offset="0" stop-color="var(--cyan)"/>
      <stop offset="1" stop-color="var(--aqua)"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
