<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Paleo Virtual FCEyN">
  <defs>
    <style>
      :root {
        --bg-a: #f4fbff;
        --bg-b: #ffffff;
        --fg: #102236;
        --cyan: #007f96;
        --aqua: #008f77;
        --grid: rgba(0, 126, 150, 0.16);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-a: #050b12;
          --bg-b: #0b1726;
          --fg: #f3ffff;
          --cyan: #59f3ff;
          --aqua: #00ffc6;
          --grid: rgba(89, 243, 255, 0.2);
        }
      }
    </style>
    <linearGradient id="bg" x1="7" x2="57" y1="6" y2="58">
      <stop offset="0" stop-color="var(--bg-b)"/>
      <stop offset="1" stop-color="var(--bg-a)"/>
    </linearGradient>
    <linearGradient id="scan" x1="20" x2="48" y1="15" y2="49">
      <stop offset="0" stop-color="var(--cyan)"/>
      <stop offset="1" stop-color="var(--aqua)"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="54" height="54" rx="16" fill="url(#bg)" stroke="var(--grid)" stroke-width="2"/>
  <path d="M17 18h8M17 18v8M47 46h-8M47 46v-8" fill="none" stroke="url(#scan)" stroke-linecap="round" stroke-width="2.4"/>
  <g filter="url(#glow)">
    <path d="M23 48V16h13c8 0 13 5 13 12s-5 12-13 12h-6v8h-7Zm7-15h6c3.6 0 6-2 6-5s-2.4-5-6-5h-6v10Z" fill="var(--fg)"/>
    <path d="M33 18c9 1 16 7 17 16" fill="none" stroke="url(#scan)" stroke-linecap="round" stroke-width="3"/>
    <path d="M35 39c5-1 9-4 12-8" fill="none" stroke="url(#scan)" stroke-linecap="round" stroke-width="3"/>
  </g>
  <circle cx="48" cy="18" r="2.2" fill="var(--aqua)"/>
</svg>
