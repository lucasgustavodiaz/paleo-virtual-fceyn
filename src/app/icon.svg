    </filter>
  </defs>
  <rect x="5" y="5" width="54" height="54" rx="16" fill="url(#surface)"/>
  <path d="M18 16h28M18 48h28M16 18v28M48 18v28" fill="none" stroke="var(--grid)" stroke-width="1.2"/>
  <path d="M18 14h10M18 14v10M46 50H36M46 50V40" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="2.4"/>
