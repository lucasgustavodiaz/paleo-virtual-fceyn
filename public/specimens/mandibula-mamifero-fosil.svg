<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Miniatura de mandíbula de mamífero fósil</title>
  <desc id="desc">Ilustración de mandíbula fósil escaneada con acentos neón.</desc>
  <defs>
    <style>
      :root{--bg:#edf8fc;--panel:#dff1f7;--line:#007f96;--glow:#008f77;--bone:#214256;--soft:#effcff;--grid:rgba(0,126,150,.14)}
      @media (prefers-color-scheme: dark){:root{--bg:#050b12;--panel:#071725;--line:#59f3ff;--glow:#00ffc6;--bone:#d5fbff;--soft:#082132;--grid:rgba(89,243,255,.16)}}
    </style>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0v44" fill="none" stroke="var(--grid)"/></pattern>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="600" fill="var(--bg)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <circle cx="626" cy="278" r="172" fill="var(--line)" opacity=".1"/>
  <rect x="92" y="80" width="616" height="424" rx="32" fill="var(--panel)" opacity=".58" stroke="var(--line)" stroke-opacity=".28"/>
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 250c86 130 210 190 356 171 84-11 141-43 171-93" stroke="var(--bone)" stroke-width="42"/>
    <path d="M252 292l-24 70M328 335l-10 80M410 361l6 78M492 355l18 70" stroke="var(--soft)" stroke-width="18"/>
    <path d="M150 250c86 130 210 190 356 171 84-11 141-43 171-93" stroke="var(--glow)" stroke-width="5" opacity=".86"/>
  </g>
  <circle cx="198" cy="214" r="42" fill="none" stroke="var(--line)" stroke-width="5" opacity=".68"/>
  <path d="M132 492h536" stroke="var(--line)" stroke-width="3" stroke-linecap="round" opacity=".44"/>
  <path d="M128 118h86M128 118v86M672 482h-86M672 482v-86" fill="none" stroke="var(--glow)" stroke-width="4" stroke-linecap="round" opacity=".75"/>
</svg>
